name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff "coverage[toml]"
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (fails under 90%)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=90
      - name: Sample packet verifies
        run: python context_wallet.py verify --packet sample-data/output_packet.json
      - name: pip install and run the console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          context-wallet --version
          context-wallet verify --packet "$GITHUB_WORKSPACE/sample-data/output_packet.json"
          context-wallet preview --profile "$GITHUB_WORKSPACE/sample-data/profile.json" \
            --fields preferred_name,timezone --recipient "CI" --purpose "CI smoke test"
          echo y | context-wallet export --profile "$GITHUB_WORKSPACE/sample-data/profile.json" \
            --fields timezone --recipient "CI" --purpose "CI smoke test" --out ci-packet.json
          context-wallet verify --packet ci-packet.json
